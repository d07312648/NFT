<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101535">
  <meta name="description" content="タップでモモンガを飛ばし、星空の森を駆け抜けるミニゲーム">
  <title>星わたり モモ</title>
  <link rel="stylesheet" href="styles.css?v=4.4.1">
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="星わたり モモ ゲーム画面">
      <canvas id="gameCanvas" aria-label="タップでモモンガを飛ばして障害物を避けるゲーム"></canvas>

      <header class="topbar">
        <div class="brand" aria-label="星わたり モモ">
          <span class="brand-star">✦</span>
          <span>星わたり モモ</span>
        </div>
        <button class="icon-button" id="soundButton" type="button" aria-label="音をオフにする" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.2-3.87v7.74A4.5 4.5 0 0 0 16.5 12Zm-2.2-7.93v2.06a6.5 6.5 0 0 1 0 11.74v2.06a8.5 8.5 0 0 0 0-15.86Z"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.27 3 16.46 16.46-1.27 1.27-3.05-3.05a8.28 8.28 0 0 1-2.11 1.25v-2.06c.24-.12.47-.26.69-.41L13 14.47V19l-5-4H4V9h2.18L3 5.82 4.27 3ZM13 5v5.47L9.74 7.21 13 5Zm5.77 2.23A8.45 8.45 0 0 1 21.5 12c0 1.2-.25 2.34-.69 3.37l-1.56-1.56A6.5 6.5 0 0 0 17.7 8.3l1.07-1.07Zm-3.26 3.26a2.4 2.4 0 0 1 0 3.02l-1.21-1.2V9.88c.47.15.88.36 1.21.61Z"/></svg>
        </button>
      </header>

      <div class="scoreboard" id="scoreboard" aria-live="polite">
        <span class="score-label">SCORE</span>
        <strong id="score">0</strong>
      </div>

      <div class="start-screen panel" id="startScreen">
        <div class="eyebrow">NIGHT GLIDER</div>
        <h1>星わたり<br><span>モモ</span></h1>
        <p class="lead">夜明けまで、光の門を<br>いくつ抜けられる？</p>
        <button class="primary-button" id="startButton" type="button">
          <span class="tap-icon" aria-hidden="true">☝</span>
          タップしてスタート
        </button>
        <div class="best-chip"><span>BEST</span><strong id="startBest">0</strong></div>
        <p class="hint">画面タップ / Space</p>
      </div>

      <div class="gameover-screen panel hidden" id="gameoverScreen">
        <div class="eyebrow">FLIGHT OVER</div>
        <div class="result-row">
          <div><span>SCORE</span><strong id="finalScore">0</strong></div>
          <i></i>
          <div><span>BEST</span><strong id="finalBest">0</strong></div>
        </div>
        <p class="new-best hidden" id="newBest">✦ NEW RECORD ✦</p>
        <button class="primary-button" id="retryButton" type="button">もう一度 飛ぶ</button>
        <button class="text-button" id="homeButton" type="button">タイトルへ</button>
      </div>

      <div class="tap-guide hidden" id="tapGuide" aria-hidden="true">
        <span>☝</span><b>TAP!</b>
      </div>

      <footer class="safe-area-note">TAP TO FLY</footer>
    </section>
  </main>
  <script src="game.js?v=4.4.1"></script>
</body>
</html>
