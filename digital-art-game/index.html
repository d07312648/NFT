<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101535">
  <meta name="description" content="長押しでモモをジャンプさせ、星の的を渡っていく横スクロールゲーム">
  <title>星わたりジャンプ モモ</title>
  <link rel="stylesheet" href="styles.css?v=1.0.0">
</head>
<body>
  <main class="app-shell">
    <section class="game-card" id="gameCard" aria-label="星あつめジャンプ モモ ゲーム画面">
      <canvas id="gameCanvas" aria-label="長押ししてモモンガを次の的へジャンプさせる横スクロールゲーム"></canvas>

      <header class="topbar">
        <div class="brand"><span>✦</span> 星わたりジャンプ</div>
        <button class="icon-button" id="soundButton" type="button" aria-label="音をオフにする" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.2-3.87v7.74A4.5 4.5 0 0 0 16.5 12Zm-2.2-7.93v2.06a6.5 6.5 0 0 1 0 11.74v2.06a8.5 8.5 0 0 0 0-15.86Z"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.27 3 16.46 16.46-1.27 1.27-3.05-3.05a8.28 8.28 0 0 1-2.11 1.25v-2.06c.24-.12.47-.26.69-.41L13 14.47V19l-5-4H4V9h2.18L3 5.82 4.27 3ZM13 5v5.47L9.74 7.21 13 5Zm5.77 2.23A8.45 8.45 0 0 1 21.5 12c0 1.2-.25 2.34-.69 3.37l-1.56-1.56A6.5 6.5 0 0 0 17.7 8.3l1.07-1.07Z"/></svg>
        </button>
      </header>

      <div class="hud" id="hud">
        <div class="hud-block life"><span>LIFE</span><strong><b>♥</b> × <em id="lives">5</em></strong></div>
        <div class="hud-block total"><span>SCORE</span><strong id="totalScore">0</strong></div>
        <div class="hud-block jumps"><span>LANDING</span><strong id="landingCount">0</strong></div>
      </div>

      <div class="power-wrap" id="powerWrap" aria-hidden="true">
        <div class="power-copy"><span id="actionLabel">長押しでジャンプ</span><b id="powerNumber">0%</b></div>
        <div class="power-track"><i id="powerFill"></i></div>
        <small>指を離してジャンプ！</small>
      </div>

      <div class="start-screen panel" id="startScreen">
        <div class="eyebrow">FLY FROM STAR TO STAR</div>
        <h1>星わたり<br><span>ジャンプ</span></h1>
        <p class="lead">5つのライフを守りながら、<br>小さな的をどこまで渡れる？</p>
        <button class="primary-button" id="startButton" type="button"><span>☝</span> あそぶ</button>
        <div class="best-chip"><span>BEST</span><strong id="startBest">0</strong></div>
        <p class="hint">長押し / Spaceキー</p>
      </div>

      <div class="round-result hidden" id="roundResult" aria-live="polite">
        <span id="resultLabel">GREAT!</span>
        <strong><b>+</b><em id="roundPoints">700</em></strong>
        <small id="resultNote">中心まで 18cm</small>
      </div>

      <div class="life-lost hidden" id="lifeLost" aria-live="assertive">
        <span>MISS...</span>
        <strong>♥ −1</strong>
      </div>

      <div class="gameover-screen panel hidden" id="gameoverScreen">
        <div class="result-card">
          <div class="eyebrow">GAME OVER</div>
          <p>スコア</p>
          <strong class="final-score" id="finalScore">0</strong>
          <div class="result-stats">
            <span>着地回数<b id="finalLandings">0</b></span>
            <span>PERFECT<b id="finalPerfects">0</b></span>
          </div>
          <p class="new-best hidden" id="newBest">✦ NEW RECORD ✦</p>
          <button class="primary-button" id="retryButton" type="button">もう一度あそぶ</button>
          <button class="text-button" id="homeButton" type="button">タイトルへ</button>
        </div>
      </div>

      <p class="ready-copy" id="readyCopy">次の的を見て<br><b>長押し！</b></p>
      <footer>HOLD · AIM · JUMP</footer>
    </section>
  </main>
  <script src="game.js?v=1.0.1"></script>
</body>
</html>
