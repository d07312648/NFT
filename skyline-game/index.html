<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101535">
  <meta name="description" content="モモの空中姿勢を左右に操り、星くずの足場をバウンドして空高くのぼるゲーム">
  <title>星くずバウンド モモ</title>
  <link rel="stylesheet" href="styles.css?v=1.0.1">
</head>
<body>
  <main class="app-shell">
    <section class="game-card" id="gameCard" aria-label="星くずバウンド モモ ゲーム画面">
      <canvas id="gameCanvas" aria-label="左右を押してモモの空中姿勢を操作する縦スクロールゲーム"></canvas>

      <header class="topbar">
        <div class="brand"><span>✦</span> 星くずバウンド</div>
        <button class="icon-button" id="soundButton" type="button" aria-label="音をオフにする" aria-pressed="true">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.2-3.87v7.74A4.5 4.5 0 0 0 16.5 12Zm-2.2-7.93v2.06a6.5 6.5 0 0 1 0 11.74v2.06a8.5 8.5 0 0 0 0-15.86Z"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.27 3 16.46 16.46-1.27 1.27-3.05-3.05a8.28 8.28 0 0 1-2.11 1.25v-2.06c.24-.12.47-.26.69-.41L13 14.47V19l-5-4H4V9h2.18L3 5.82 4.27 3ZM13 5v5.47L9.74 7.21 13 5Zm5.77 2.23A8.45 8.45 0 0 1 21.5 12c0 1.2-.25 2.34-.69 3.37l-1.56-1.56A6.5 6.5 0 0 0 17.7 8.3l1.07-1.07Z"/></svg>
        </button>
      </header>

      <div class="hud" id="hud">
        <div class="hud-block"><span>SCORE</span><strong><b id="score">0</b><small>pt</small></strong></div>
        <div class="hud-block hud-center"><span>BEST</span><strong><b id="bestScore">0</b><small>pt</small></strong></div>
        <div class="hud-block hud-right"><span>COMBO</span><strong><b id="combo">0</b><small>x</small></strong></div>
      </div>

      <div class="landing-toast hidden" id="landingToast" aria-live="polite">
        <strong id="toastTitle">PERFECT!</strong>
        <span id="toastDetail">姿勢 0°</span>
      </div>

      <div class="start-screen panel" id="startScreen">
        <div class="eyebrow">BOUNCE TO THE STARS</div>
        <h1>星くず<br><span>バウンド</span></h1>
        <p class="lead">モモの体を左右にかたむけて、<br>かたむけた方向へ飛びながらのぼろう。</p>
        <div class="howto">
          <span><i>↶</i><b>左を押す</b><small>左に回転</small></span>
          <em>傾けた<br>方向へ！</em>
          <span><i>↷</i><b>右を押す</b><small>右に回転</small></span>
        </div>
        <button class="primary-button" id="startButton" type="button"><span>▲</span> のぼる</button>
        <div class="best-chip"><span>BEST SCORE</span><strong><b id="startBest">0</b>pt</strong></div>
        <p class="hint">一発勝負 · 画面タップ / ← → / A D</p>
      </div>

      <div class="gameover-screen panel hidden" id="gameoverScreen">
        <div class="result-card">
          <div class="eyebrow">FLIGHT RESULT</div>
          <p>スコア</p>
          <strong class="final-height"><b id="finalScore">0</b><small>pt</small></strong>
          <div class="result-stats">
            <span>触れたバー<b id="finalLandings">0</b></span>
            <span>最大コンボ<b id="finalCombo">0</b></span>
          </div>
          <p class="new-best hidden" id="newBest">✦ NEW RECORD ✦</p>
          <button class="primary-button" id="retryButton" type="button">もう一度のぼる</button>
          <button class="text-button" id="homeButton" type="button">タイトルへ</button>
        </div>
      </div>

      <div class="countdown hidden" id="countdown" aria-live="polite">READY</div>

      <div class="controls" id="controls" aria-label="姿勢操作">
        <button id="leftControl" type="button" aria-label="左に回転"><span>↶</span><b>LEFT</b></button>
        <div class="attitude" id="attitude"><i></i><span>進む角度</span></div>
        <button id="rightControl" type="button" aria-label="右に回転"><span>↷</span><b>RIGHT</b></button>
      </div>
      <footer>LEAN · LAND · CLIMB</footer>
    </section>
  </main>
  <script src="game.js?v=1.0.2"></script>
</body>
</html>
